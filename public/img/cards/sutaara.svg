<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Paisagem do card de Sutaara. Animações e cores ficam aqui dentro. -->
<style>
  .longe{fill:#2b6446;opacity:.55;animation:resp 12s ease-in-out -2s infinite}
  .terra-2{fill:#2b6446;animation:resp 9s ease-in-out infinite}
  .terra{fill:#143323;animation:resp 9s ease-in-out -4s infinite}
  .arv{transform-box:fill-box;transform-origin:50% 100%;animation:vento 6s ease-in-out infinite}
  .arv:nth-of-type(2n){animation-duration:7.5s;animation-delay:-2s}
  .arv:nth-of-type(3n){animation-duration:5.2s;animation-delay:-3.5s}
  .fogo{fill:#ffe296;opacity:0;animation:vaga 8s ease-in-out infinite}
  .fogo.b{animation-delay:-2.6s}.fogo.c{animation-delay:-5s}.fogo.d{animation-delay:-1.2s}
  @keyframes resp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes vento{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  @keyframes vaga{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:.9}60%{opacity:.7;transform:translate(10px,-14px)}85%{opacity:0;transform:translate(16px,-24px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.fogo{opacity:0}}
</style>

