<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Fábrica do card de Lock. Animações e cores ficam aqui dentro. -->
<style>
  .terra-2{fill:#3a3c40}
  .terra{fill:#1d1e20}
  .linha{fill:none;stroke:#1d1e20;stroke-width:2;stroke-linecap:round}
  .jl{fill:#e0705f;opacity:.85;animation:acende 8s ease-in-out infinite}
  .jl:nth-of-type(2n){animation-duration:10s;animation-delay:-3s}
  .fum{fill:#9a9794;opacity:0;transform-box:fill-box;transform-origin:center;animation:fumaca 7s ease-out infinite}
  .f2{animation-delay:-3.5s}.f3{animation-delay:-1.5s}.f4{animation-delay:-4.5s}.f5{animation-delay:-2.5s}
  .po{fill:#cfcac4;opacity:0;animation:poeira 10s linear infinite}
  .po.b{animation-delay:-3s}.po.c{animation-delay:-6s}.po.d{animation-delay:-8s}
  @keyframes acende{0%,100%{opacity:.95}45%{opacity:.55}55%{opacity:.85}}
  @keyframes fumaca{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.4}100%{opacity:0;transform:translate(10px,-26px) scale(2.2)}}
  @keyframes poeira{0%{opacity:0;transform:translate(0,0)}20%{opacity:.5}100%{opacity:0;transform:translate(14px,-90px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.fum,.po{opacity:0}}
</style>

