<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Fundo do card do Lineborn: nuvens, corte diagonal, cabo e fio tracejado. -->
<style>
  .nuvem{fill:#fff;fill-opacity:.12}
  .n2{fill-opacity:.09}
  .corte{fill:#04060a}
  .fio{fill:none;stroke:#fff;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .cabo{stroke-width:1.3;opacity:.7}
  .trac{stroke-width:1;opacity:.45;stroke-dasharray:3 6;animation:corre 1.4s linear infinite}
  .luz{fill:#fff;opacity:.9}
  @keyframes corre{to{stroke-dashoffset:-18}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.luz{display:none}}
</style>
<path class="nuvem" d="M0,332 C30,304 76,302 100,324 C124,298 190,300 206,328 C222,312 262,314 276,332 L276,380 L0,380Z"/>
<path class="nuvem n2" d="M210,344 C240,318 300,316 326,340 C344,328 380,328 400,342 L400,380 L210,380Z"/>
<path class="corte" d="M0,358 L400,338 L400,380 L0,380Z"/>
<path class="fio cabo" d="M-5,12 C90,22 200,8 405,20"/>
<path class="fio trac" d="M-5,300 C50,282 110,320 190,296 S320,276 405,304"/>
<circle class="luz" r="2.6">
  <animateMotion dur="9s" repeatCount="indefinite" path="M0,14 C90,22 200,9 400,20" keyPoints="0;1;1" keyTimes="0;.9;1" calcMode="linear"/>
  <animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.1;.8;.9;1" dur="9s" repeatCount="indefinite"/>
</circle>
</svg>
